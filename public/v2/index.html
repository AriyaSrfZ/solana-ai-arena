<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c0a">
  <title>OMNI//GRID — Apex Syndicate Arena</title>
  <link rel="stylesheet" href="system/omni.css?v=5">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="system/omni.js?v=5" defer></script>
  <script src="system/cloud.js?v=5" defer></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--night-0);
      color: var(--ink);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .arena-layout {
      position: relative;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 72px var(--s4) 100px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: var(--s4);
    }
    .combat-terminal {
      background: var(--night-2);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: var(--s4);
      min-height: 220px;
      max-height: 320px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: 0.85rem;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .taunt-bubble {
      padding: var(--s2) var(--s3);
      border-left: 2px solid var(--sky);
      background: rgba(228, 220, 192, 0.05);
      color: var(--ice);
      font-style: italic;
    }
    table.og-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }
    table.og-table th {
      padding: var(--s3);
      color: var(--ink-3);
      border-bottom: 1px solid var(--line);
      font-weight: 600;
    }
    table.og-table td {
      padding: var(--s3);
      border-bottom: 1px solid var(--line);
      font-family: var(--mono);
      color: var(--ink-2);
    }
  </style>
</head>
<body>
  <!-- Top Bar Glass -->
  <header class="og-bar og-glass">
    <div class="og-bar__inner" style="max-width: 820px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; width: 100%;">
      <a href="/" class="og-wordmark" style="text-decoration: none; color: inherit;">
        OMNI<b>//</b>GRID <span class="og-caption" style="color: var(--sky); margin-left: var(--s2);">ARENA</span>
      </a>
      <div style="display: flex; align-items: center; gap: var(--s2);">
        <span class="og-seal"><span class="og-seal__dot"></span> APEX SYNDICATE</span>
        <a href="/" class="og-iconbtn" title="Back to Hub" style="text-decoration: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: var(--night-2); border: 1px solid var(--line); color: var(--ink);">✕</a>
      </div>
    </div>
  </header>

  <main class="arena-layout">
    <!-- Division Rank Header -->
    <div class="og-panel" style="padding: var(--s5); display: flex; justify-content: space-between; align-items: center;">
      <div>
        <span class="og-caption" style="color: var(--ink-3);">ACTIVE GLADIATOR CLASSIFICATION</span>
        <div class="og-headline" id="rank-display" style="color: var(--ice); margin-top: 4px;">
          SILVER IV (1218 MMR)
        </div>
      </div>
      <div style="display: flex; gap: var(--s2);">
        <button class="og-btn og-btn--quiet" onclick="mintPack('NOVICE')">MINT STARTER (0.1 SOL)</button>
        <button class="og-btn og-btn--quiet" onclick="mintPack('CHAMPION')">MINT CHAMPION (1.0 SOL)</button>
      </div>
    </div>

    <!-- Matchmaking & Battle View -->
    <div class="og-panel" style="padding: var(--s5);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--s4);">
        <span class="og-caption" style="color: var(--ink-3);">BATTLE ARENA TELEMETRY</span>
        <div class="og-chips" style="display: flex; gap: var(--s2);">
          <button class="og-btn og-btn--primary" onclick="startRankedBattle(1.0)">DUEL (1.0 SOL)</button>
          <button class="og-btn og-btn--primary" onclick="startRankedBattle(5.0)">HIGH-ROLLER (5.0 SOL)</button>
        </div>
      </div>

      <!-- Combat Feed -->
      <div class="combat-terminal" id="feed">
        <div style="color: var(--ink-3);">Awaiting gladiator deployment in Neo-Tokyo district...</div>
      </div>
    </div>

    <!-- Competitive Ladder -->
    <div class="og-panel" style="padding: var(--s5);">
      <span class="og-caption" style="color: var(--ink-3); margin-bottom: var(--s3); display: block;">APEX SYNDICATE STANDINGS</span>
      <table class="og-table">
        <thead>
          <tr>
            <th>#</th>
            <th>OPERATOR</th>
            <th>TIER</th>
            <th>MMR</th>
            <th>W/L</th>
            <th>REWARD SHARE</th>
          </tr>
        </thead>
        <tbody id="ladder-body">
          <tr><td colspan="6" style="text-align: center; color: var(--ink-3);">Loading standings...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    async function loadLadder() {
      try {
        const res = await fetch('/api/ladder');
        const data = await res.json();
        const body = document.getElementById('ladder-body');
        body.innerHTML = '';
        data.leaderboard.forEach((p, idx) => {
          body.innerHTML += `
            <tr>
              <td>#${idx + 1}</td>
              <td class="og-hash">${p.wallet}</td>
              <td style="color: var(--ice); font-weight: 700;">${p.tier} ${p.division} (${p.lp} LP)</td>
              <td>${p.mmr}</td>
              <td>${p.wins}W - ${p.losses}L</td>
              <td style="color: var(--gain);">${(p.seasonRewardPoolSharePercent * 100).toFixed(0)}%</td>
            </tr>
          `;
        });
      } catch (e) {}
    }

    async function mintPack(type) {
      alert(`Minting ${type} Gladiator. Direct payout to operator wallet: GPnfvrNrro1PJTbN4moGkTwtJm3iqywLDZnAYY7pco52`);
      const res = await fetch('/api/packs/mint', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ packType: type, universe: 'NEO_TOKYO' })
      });
      const data = await res.json();
      alert(`MINT CONFIRMED: ${data.gladiators[0].rarity} gladiator acquired.`);
    }

    async function startRankedBattle(wagerSol) {
      const feed = document.getElementById('feed');
      feed.innerHTML = `<div style="color: var(--sky);">[DEPLOY] Entering Apex Ranked Arena (Stake: ${wagerSol} SOL)...</div>`;

      const res = await fetch('/api/match', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ universe: 'NEO_TOKYO', wagerSol })
      });
      const match = await res.json();

      let i = 0;
      const interval = setInterval(() => {
        if (i >= match.log.length) {
          clearInterval(interval);
          const r = match.rankedUpdate;
          document.getElementById('rank-display').innerText = `${r.tier} ${r.division} (${r.currentMmr} MMR)`;
          feed.innerHTML += `<div style="color: var(--gain); font-weight: 700; margin-top: 8px;">[VICTORY] Winner: ${match.winnerName}! MMR: +${r.mmrChange}</div>`;
          loadLadder();
          return;
        }
        const action = match.log[i];
        feed.innerHTML += `<div>Round ${action.turn}: ${action.combatLog}</div>`;
        if (action.tauntMessage) {
          feed.innerHTML += `<div class="taunt-bubble">${action.tauntMessage}</div>`;
        }
        feed.scrollTop = feed.scrollHeight;
        i++;
      }, 400);
    }

    loadLadder();
  </script>
</body>
</html>
